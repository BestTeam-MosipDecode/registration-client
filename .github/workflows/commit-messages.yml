name: Commit messages

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the commits of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-commit-messages.sh --range "$BASE_SHA..$HEAD_SHA"
      - name: Check the title and description of the pull request
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bash .github/scripts/check-commit-messages.sh --text "$PR_TITLE" "pull request title"
          bash .github/scripts/check-commit-messages.sh --text "$PR_BODY" "pull request description"
